name: Reproduce numerical results
on:
  push:
    paths:
      - 'code/**'
      - '.github/workflows/reproduce.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: numerical-publication
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependency
        run: python -m pip install -r code/requirements.txt
      - name: Verify original examples
        run: python code/verify_conservation.py
      - name: Verify channel and protocol examples
        run: python code/verify_revision.py
      - name: Assemble verification summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('code')
          a = json.loads((p/'computed_results.json').read_text())
          b = json.loads((p/'revision_results.json').read_text())
          assert a['checks_passed'] == 617 and b['checks_passed'] == 88
          assert a['checks_failed'] == b['checks_failed'] == 0
          report = {'original_checks': 617, 'supplementary_checks': 88,
                    'total_checks_passed': 705, 'total_checks_failed': 0,
                    'absolute_tolerance': 5e-11,
                    'interpretation': 'Numerical consistency checks, not experimental tests.'}
          (p/'verification_summary.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
      - name: Commit generated numerical results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/computed_results.json code/revision_results.json code/finite_reference_table.csv code/verification_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record reproduced numerical results: 705 passing checks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
